<!DOCTYPE html>
<html>
<head>
<title>Speech Image Display - Voice Assistant Style</title>

<style>
/* Background animation */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(270deg,#ff9a9e,#fad0c4,#a18cd1,#fbc2eb);
  background-size: 800% 800%;
  animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Glass card */
.container {
  width: 650px;
  padding: 40px;
  text-align: center;
  border-radius: 20px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* Title */
h2{
  color: white;
  font-size: 30px;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

/* Microphone button */
.mic-button {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(45deg,#ff416c,#ff4b2b);
  color: white;
  font-size: 30px;
  cursor: pointer;
  position: relative;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

.mic-button:hover{
  transform: scale(1.1);
  background: linear-gradient(45deg,#00c6ff,#0072ff);
  box-shadow: 0 0 25px #00c6ff;
}

/* Pulse animation when listening */
.mic-button.listening{
  animation: pulse 1s infinite;
}

@keyframes pulse{
0% { box-shadow: 0 0 0 0 rgba(0,198,255,0.7); }
70% { box-shadow: 0 0 0 20px rgba(0,198,255,0); }
100% { box-shadow: 0 0 0 0 rgba(0,198,255,0); }
}

/* Waveform container */
.waveform {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 50px;
  margin: 20px 0;
}

.wave {
  width: 6px;
  height: 10px;
  margin: 0 3px;
  background: #00c6ff;
  animation: waveAnim 1s infinite ease-in-out;
}

.wave:nth-child(1){ animation-delay: 0s; }
.wave:nth-child(2){ animation-delay: 0.1s; }
.wave:nth-child(3){ animation-delay: 0.2s; }
.wave:nth-child(4){ animation-delay: 0.3s; }
.wave:nth-child(5){ animation-delay: 0.4s; }

@keyframes waveAnim{
0%,100%{ height:10px;}
50%{ height:40px;}
}

/* Command text */
#commandText{
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

/* Image display */
img{
  margin-top:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  transition: transform 0.4s ease;
}

img:hover{
  transform: scale(1.05);
}

</style>

</head>

<body>

<div class="container">

<h2>🎤 voice image Assistant</h2>

<!-- Microphone button -->
<button class="mic-button" id="micBtn" onclick="startVoice()">🎤</button>

<!-- Animated waveform -->
<div class="waveform" id="waveform" style="display:none;">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<div id="commandText"></div>

<img id="imageBox" width="400">

</div>

<script>
function startVoice(){

const micBtn = document.getElementById("micBtn");
const waveform = document.getElementById("waveform");

// Show waveform & start pulse animation
micBtn.classList.add("listening");
waveform.style.display="flex";
document.getElementById("commandText").innerHTML="🎤 Listening...";

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SpeechRecognition){
alert("Speech recognition not supported");
micBtn.classList.remove("listening");
waveform.style.display="none";
return;
}

const recognition = new SpeechRecognition();
recognition.lang = "en-US";

recognition.start();

recognition.onresult = function(event){
  let command = event.results[0][0].transcript;
  document.getElementById("commandText").innerHTML="You said: "+command;
  sendCommand(command);
  micBtn.classList.remove("listening");
  waveform.style.display="none";
}

recognition.onerror = function(event){
  document.getElementById("commandText").innerHTML="Error: "+event.error;
  micBtn.classList.remove("listening");
  waveform.style.display="none";
}

}

function sendCommand(command){
fetch("/command",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({command:command})
})
.then(res=>res.json())
.then(data=>{
  if(data.image){
    document.getElementById("imageBox").src="/static/images/"+data.image;
  }
})
}
</script>

</body>
</html>
